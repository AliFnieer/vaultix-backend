openapi: 3.0.3
info:
  title: Vaultix API
  description: |
    Production-grade backend for a secrets / password vault application.

    ## Authentication

    Most endpoints require a JWT access token sent in the `Authorization` header:

    ```
    Authorization: Bearer <access_token>
    ```

    Obtain a token pair via `POST /api/v1/auth/login` or `POST /api/v1/auth/register`.
    Use `POST /api/v1/auth/refresh` to rotate a refresh token into a new access token.

    ## Errors

    All error responses follow a standardized envelope:

    ```json
    {
      "error": "human-readable message",
      "code": "VALIDATION"
    }
    ```

    Common error codes: `VALIDATION`, `NOT_FOUND`, `CONFLICT`, `UNAUTHORIZED`, `FORBIDDEN`, `INTERNAL`.

  contact:
    name: Vaultix Support
    url: https://github.com/AliFnieer/vaultix-backend
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.vaultix.example.com
    description: Production server

tags:
  - name: Auth
    description: Authentication (register, login, token refresh, logout, me)
  - name: Users
    description: User profile and administration
  - name: Secrets
    description: Encrypted secrets (CRUD + archive/trash/favorite)
  - name: Vaults
    description: Vaults for organizing secrets
  - name: Audit
    description: Audit log query (append-only, server-written)
  - name: Health
    description: Liveness / readiness health check

paths:
  # ------------------------------------------------------------------
  # Health
  # ------------------------------------------------------------------
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns service health including database and Redis connectivity.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy (database or Redis unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ------------------------------------------------------------------
  # Auth
  # ------------------------------------------------------------------
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: Creates a user account and returns a JWT access + refresh token pair.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: alice@example.com
              password: Str0ng!Pass
              first_name: Alice
              last_name: Example
      responses:
        '201':
          description: Account created, token pair returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Authenticates with email + password and returns a JWT access + refresh token pair.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@example.com
              password: Str0ng!Pass
      responses:
        '200':
          description: Authenticated, token pair returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Rotates a refresh token into a new access + refresh token pair (refresh token rotation).
      operationId: refresh
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: eyJhbG... (opaque refresh token)
      responses:
        '200':
          description: New token pair returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Revokes all refresh tokens for the authenticated user. Requires a valid access token.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: logged out successfully
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      description: Returns the profile of the authenticated user. Requires a valid access token.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ------------------------------------------------------------------
  # Users
  # ------------------------------------------------------------------
  /api/v1/users/profile:
    get:
      tags: [Users]
      summary: Get current user profile
      description: Returns the profile of the authenticated user. Requires a valid access token.
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Returns a public user profile by ID. Requires a valid access token.
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: MongoDB ObjectID of the user (24 hex chars)
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '400':
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ------------------------------------------------------------------
  # Secrets
  # ------------------------------------------------------------------
  /api/v1/secrets:
    post:
      tags: [Secrets]
      summary: Create a secret
      description: Creates an encrypted secret entry. Fields are encrypted at rest with AES-256-GCM. Requires a valid access token.
      operationId: createSecret
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretRequest'
            example:
              title: Production DB Password
              type: login
              vault_id: 64f7a1b2c3d4e5f6a7b8c9d0
              fields:
                username: admin
                password: s3cr3tP@ss
                host: db.example.com
                port: "5432"
              tags:
                - production
                - database
              favorite: false
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Vault not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Secrets]
      summary: List secrets
      description: Returns a paginated list of secrets belonging to the authenticated user. Requires a valid access token.
      operationId: listSecrets
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (max 100)
          example: 20
        - in: query
          name: vault_id
          schema:
            type: string
            format: objectid
          description: Filter by vault ID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        - in: query
          name: search
          schema:
            type: string
          description: Search term matched against secret title
          example: production
        - in: query
          name: include_archived
          schema:
            type: boolean
            default: false
          description: Include archived secrets
          example: false
        - in: query
          name: include_trashed
          schema:
            type: boolean
            default: false
          description: Include trashed secrets
          example: false
      responses:
        '200':
          description: Paginated list of secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecretsResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/secrets/{id}:
    get:
      tags: [Secrets]
      summary: Get a secret by ID
      description: Returns a single secret by ID. Requires a valid access token.
      operationId: getSecretById
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: Secret MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      responses:
        '200':
          description: Secret found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          description: Invalid secret ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to access this secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Secrets]
      summary: Update a secret
      description: Replaces a secret's fields. All request fields are required. Requires a valid access token.
      operationId: updateSecret
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: Secret MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecretRequest'
            example:
              title: Production DB Password (updated)
              type: login
              vault_id: 64f7a1b2c3d4e5f6a7b8c9d0
              fields:
                username: admin
                password: n3wP@ssw0rd
                host: db.example.com
                port: "5432"
              tags:
                - production
              favorite: true
      responses:
        '200':
          description: Secret updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to update this secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Secrets]
      summary: Delete a secret
      description: Permanently deletes a secret by ID. Requires a valid access token.
      operationId: deleteSecret
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: Secret MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      responses:
        '200':
          description: Secret deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: secret deleted
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to delete this secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/secrets/{id}/archive:
    post:
      tags: [Secrets]
      summary: Archive a secret
      description: Archives (soft-hides) a secret. Requires a valid access token.
      operationId: archiveSecret
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: Secret MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      responses:
        '200':
          description: Secret archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: secret archived
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/secrets/{id}/unarchive:
    post:
      tags: [Secrets]
      summary: Unarchive a secret
      description: Restores an archived secret to active state. Requires a valid access token.
      operationId: unarchiveSecret
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: Secret MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      responses:
        '200':
          description: Secret unarchived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: secret unarchived
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/secrets/{id}/trash:
    post:
      tags: [Secrets]
      summary: Move a secret to trash
      description: Soft-deletes a secret by moving it to the trash. Requires a valid access token.
      operationId: trashSecret
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: Secret MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      responses:
        '200':
          description: Secret moved to trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: secret moved to trash
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/secrets/{id}/restore:
    post:
      tags: [Secrets]
      summary: Restore a secret from trash
      description: Restores a trashed secret back to active state. Requires a valid access token.
      operationId: restoreSecret
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: Secret MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      responses:
        '200':
          description: Secret restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: secret restored
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/secrets/{id}/favorite:
    post:
      tags: [Secrets]
      summary: Toggle favorite flag on a secret
      description: Toggles the `favorite` boolean on a secret and returns the new value. Requires a valid access token.
      operationId: toggleFavoriteSecret
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: Secret MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      responses:
        '200':
          description: Favorite flag toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorite:
                    type: boolean
                    description: New favorite state
                    example: true
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ------------------------------------------------------------------
  # Vaults
  # ------------------------------------------------------------------
  /api/v1/vaults:
    post:
      tags: [Vaults]
      summary: Create a vault
      description: Creates a vault for organizing secrets. Requires a valid access token.
      operationId: createVault
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVaultRequest'
            example:
              name: Personal
              description: Personal secrets vault
              color: "#3b82f6"
              icon: folder
              sort_order: 1
      responses:
        '201':
          description: Vault created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Vaults]
      summary: List vaults
      description: Returns all vaults belonging to the authenticated user. Requires a valid access token.
      operationId: listVaults
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of vaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  vaults:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vault'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/vaults/{id}:
    get:
      tags: [Vaults]
      summary: Get a vault by ID
      description: Returns a single vault by ID. Requires a valid access token.
      operationId: getVaultById
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: Vault MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      responses:
        '200':
          description: Vault found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '400':
          description: Invalid vault ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to access this vault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Vault not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Vaults]
      summary: Update a vault
      description: Updates a vault's metadata. All request fields are required. Requires a valid access token.
      operationId: updateVault
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: Vault MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVaultRequest'
            example:
              name: Personal (updated)
              description: Updated personal vault
              color: "#10b981"
              icon: shield
              sort_order: 2
      responses:
        '200':
          description: Vault updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to update this vault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Vault not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Vaults]
      summary: Delete a vault
      description: Deletes a vault by ID. Requires a valid access token.
      operationId: deleteVault
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: objectid
            minLength: 24
            maxLength: 24
          description: Vault MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
      responses:
        '200':
          description: Vault deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: vault deleted
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to delete this vault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Vault not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ------------------------------------------------------------------
  # Audit
  # ------------------------------------------------------------------
  /api/v1/audit/logs:
    get:
      tags: [Audit]
      summary: List audit logs
      description: Returns a paginated list of audit log entries for the authenticated user. Requires a valid access token.
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (max 100)
          example: 20
        - in: query
          name: action
          schema:
            type: string
            enum:
              - secret.create
              - secret.read
              - secret.update
              - secret.delete
              - secret.restore
              - secret.share
              - vault.create
              - vault.read
              - vault.update
              - vault.delete
              - user.login
              - user.register
              - user.refresh_token
              - user.logout
          description: Filter by audit action
          example: secret.create
        - in: query
          name: resource_type
          schema:
            type: string
            enum:
              - secret
              - vault
              - user
          description: Filter by resource type
          example: secret
      responses:
        '200':
          description: Paginated list of audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  total:
                    type: integer
                    format: int64
                    example: 42
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from `/api/v1/auth/login` or `/api/v1/auth/register`.
        Format: `Authorization: Bearer <token>`

  schemas:
    # ----------------------------------------------------------------
    # Auth
    # ----------------------------------------------------------------
    User:
      type: object
      description: A registered user.
      properties:
        id:
          type: string
          format: objectid
          description: User MongoDB ObjectID
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        email:
          type: string
          format: email
          example: alice@example.com
        first_name:
          type: string
          example: Alice
        last_name:
          type: string
          example: Example
        role:
          type: string
          enum: [user, admin]
          example: user
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T08:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-16T12:45:00Z"
      required:
        - email
        - first_name
        - last_name
        - role
        - is_active

    UserPublic:
      type: object
      description: Public subset of user fields returned by lookup endpoints.
      properties:
        id:
          type: string
          format: objectid
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        first_name:
          type: string
          example: Alice
        last_name:
          type: string
          example: Example
        email:
          type: string
          format: email
          example: alice@example.com
        role:
          type: string
          enum: [user, admin]
          example: user

    RegisterRequest:
      type: object
      description: Registration payload.
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: Str0ng!Pass
        first_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Alice
        last_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Example
      required:
        - email
        - password
        - first_name
        - last_name

    LoginRequest:
      type: object
      description: Login payload.
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: Str0ng!Pass
      required:
        - email
        - password

    RefreshRequest:
      type: object
      description: Token refresh payload.
      properties:
        refresh_token:
          type: string
          description: Opaque refresh token issued at login/registration
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - refresh_token

    AuthResponse:
      type: object
      description: Token pair returned on successful authentication.
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 900
        user:
          $ref: '#/components/schemas/User'
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - user

    # ----------------------------------------------------------------
    # Secrets
    # ----------------------------------------------------------------
    Secret:
      type: object
      description: An encrypted secret entry. Field values are encrypted at rest (AES-256-GCM).
      properties:
        id:
          type: string
          format: objectid
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        user_id:
          type: string
          format: objectid
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        vault_id:
          type: string
          format: objectid
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        title:
          type: string
          maxLength: 200
          example: Production DB Password
        type:
          type: string
          enum: [login, note, card, api_key, custom]
          example: login
        fields:
          type: object
          description: Encrypted key/value fields (e.g. username, password, host)
          additionalProperties:
            type: string
          example:
            username: admin
            password: s3cr3tP@ss
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
          example: [production, database]
        favorite:
          type: boolean
          example: false
        is_archived:
          type: boolean
          example: false
        is_trashed:
          type: boolean
          example: false
        password_age:
          type: string
          format: date-time
          nullable: true
          example: "2024-01-10T08:00:00Z"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T08:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-16T12:45:00Z"
      required:
        - user_id
        - vault_id
        - title
        - type
        - fields

    CreateSecretRequest:
      type: object
      description: Payload for creating a secret.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Production DB Password
        type:
          type: string
          enum: [login, note, card, api_key, custom]
          example: login
        vault_id:
          type: string
          format: objectid
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        fields:
          type: object
          description: Key/value fields to encrypt (e.g. username, password)
          additionalProperties:
            type: string
          example:
            username: admin
            password: s3cr3tP@ss
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
          example: [production, database]
        favorite:
          type: boolean
          default: false
          example: false
      required:
        - title
        - type
        - vault_id
        - fields

    UpdateSecretRequest:
      type: object
      description: Payload for updating a secret (all fields required).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Production DB Password (updated)
        type:
          type: string
          enum: [login, note, card, api_key, custom]
          example: login
        vault_id:
          type: string
          format: objectid
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        fields:
          type: object
          additionalProperties:
            type: string
          example:
            username: admin
            password: n3wP@ssw0rd
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
          example: [production]
        favorite:
          type: boolean
          example: true
      required:
        - title
        - type
        - vault_id
        - fields

    ListSecretsResponse:
      type: object
      description: Paginated list of secrets.
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/Secret'
        total:
          type: integer
          format: int64
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
      required:
        - secrets
        - total
        - page
        - limit

    # ----------------------------------------------------------------
    # Vaults
    # ----------------------------------------------------------------
    Vault:
      type: object
      description: A user's vault for organizing secrets.
      properties:
        id:
          type: string
          format: objectid
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        user_id:
          type: string
          format: objectid
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        name:
          type: string
          maxLength: 100
          example: Personal
        description:
          type: string
          maxLength: 500
          example: Personal secrets vault
        color:
          type: string
          maxLength: 7
          pattern: "^#?[0-9A-Fa-f]{6}$"
          example: "#3b82f6"
        icon:
          type: string
          maxLength: 50
          example: folder
        is_default:
          type: boolean
          example: false
        sort_order:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T08:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-16T12:45:00Z"
      required:
        - user_id
        - name

    CreateVaultRequest:
      type: object
      description: Payload for creating a vault.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Personal
        description:
          type: string
          maxLength: 500
          example: Personal secrets vault
        color:
          type: string
          maxLength: 7
          pattern: "^#?[0-9A-Fa-f]{6}$"
          example: "#3b82f6"
        icon:
          type: string
          maxLength: 50
          example: folder
        sort_order:
          type: integer
          example: 1
      required:
        - name

    UpdateVaultRequest:
      type: object
      description: Payload for updating a vault (all fields required).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Personal (updated)
        description:
          type: string
          maxLength: 500
          example: Updated personal vault
        color:
          type: string
          maxLength: 7
          pattern: "^#?[0-9A-Fa-f]{6}$"
          example: "#10b981"
        icon:
          type: string
          maxLength: 50
          example: shield
        sort_order:
          type: integer
          example: 2
      required:
        - name

    # ----------------------------------------------------------------
    # Audit
    # ----------------------------------------------------------------
    AuditLog:
      type: object
      description: An append-only audit log entry (written server-side).
      properties:
        id:
          type: string
          format: objectid
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        user_id:
          type: string
          format: objectid
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        action:
          type: string
          enum:
            - secret.create
            - secret.read
            - secret.update
            - secret.delete
            - secret.restore
            - secret.share
            - vault.create
            - vault.read
            - vault.update
            - vault.delete
            - user.login
            - user.register
            - user.refresh_token
            - user.logout
          example: secret.create
        resource_type:
          type: string
          enum: [secret, vault, user]
          example: secret
        resource_id:
          type: string
          format: objectid
          nullable: true
          example: 64f7a1b2c3d4e5f6a7b8c9d0
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          example:
            ip: 192.168.1.1
        ip_address:
          type: string
          nullable: true
          example: 192.168.1.1
        user_agent:
          type: string
          nullable: true
          example: Mozilla/5.0 ...
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T08:30:00Z"

    # ----------------------------------------------------------------
    # Common
    # ----------------------------------------------------------------
    ErrorResponse:
      type: object
      description: Standardized error envelope.
      properties:
        error:
          type: string
          example: validation failed
        code:
          type: string
          enum: [VALIDATION, NOT_FOUND, CONFLICT, UNAUTHORIZED, FORBIDDEN, INTERNAL, RATE_LIMITED, UNAVAILABLE]
          example: VALIDATION
      required:
        - error
        - code

    MessageResponse:
      type: object
      description: Simple message response.
      properties:
        message:
          type: string
          example: operation completed successfully
      required:
        - message

    HealthResponse:
      type: object
      description: Health check response.
      properties:
        status:
          type: string
          enum: [ok, error]
          example: ok
        database:
          type: string
          enum: [ok, error]
          example: ok
        redis:
          type: string
          enum: [ok, error]
          example: ok
      required:
        - status
        - database
        - redis

